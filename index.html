<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نظام حياتي">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>نظام حياتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: bottom-tab planner. Today = timeline + checklists, Week = column grid + habit matrix, Month = heat calendar. Dark-first, steel-blue / copper-brown / sand on near-black. */
:root{
  --font-display:'Reem Kufi','Cairo','Tahoma',sans-serif;
  --font-body:'IBM Plex Sans Arabic','Tahoma','Segoe UI',sans-serif;
  --bg:#090c12; --s1:#10151e; --s2:#171e2b; --line:#242e41;
  --fg:#e9ecf3; --mute:#8b95a9; --accent:#6c97e0; --accent-ink:#071022;
  --good:#7fb394; --warn:#d6a35c;
  --c-worship:#6c97e0; --c-uni:#c28a5e; --c-study:#d8c6a6; --c-dev:#8ea3c4;
  --c-body:#a8a29a; --c-rest:#7b8496; --c-social:#b98f7a; --c-move:#5d6676;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#edf0f5; --s1:#ffffff; --s2:#f4f6fa; --line:#d5dbe6;
    --fg:#111827; --mute:#5d6778; --accent:#2f5fa8; --accent-ink:#ffffff;
    --good:#3f7d5c; --warn:#9a6a1f;
    --c-worship:#2f5fa8; --c-uni:#8a5a36; --c-study:#8c7650; --c-dev:#52698f;
    --c-body:#75706a; --c-rest:#667085; --c-social:#8e5f4b; --c-move:#7b8494;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#edf0f5; --s1:#ffffff; --s2:#f4f6fa; --line:#d5dbe6;
  --fg:#111827; --mute:#5d6778; --accent:#2f5fa8; --accent-ink:#ffffff;
  --good:#3f7d5c; --warn:#9a6a1f;
  --c-worship:#2f5fa8; --c-uni:#8a5a36; --c-study:#8c7650; --c-dev:#52698f;
  --c-body:#75706a; --c-rest:#667085; --c-social:#8e5f4b; --c-move:#7b8494;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;line-height:1.3;text-wrap:balance}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:18px}
.wrap.wide{max-width:1120px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}
.small{font-size:12.5px}
.lbl{font-size:12px;letter-spacing:.04em;color:var(--mute);font-weight:500}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top h1{font-size:30px}
.top .sub{display:flex;flex-direction:column;gap:2px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navrow{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:12.5px;color:var(--mute)}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill b{color:var(--fg);font-weight:600}
.pill.on b{color:inherit}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card h2{font-size:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}

/* progress */
.prog{display:flex;flex-direction:column;gap:10px}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.big{font-family:var(--font-display);font-size:44px;line-height:1;font-weight:700}
.bar{height:10px;border-radius:999px;background:var(--s2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .35s ease}
.bar.core>i{background:var(--c-uni)}
.prog-meta{display:flex;flex-wrap:wrap;gap:8px}
.tired{display:flex;align-items:center;gap:8px;border:1px dashed var(--line);background:transparent;border-radius:12px;padding:8px 12px;text-align:start;width:100%}
.tired.on{border-style:solid;border-color:var(--c-uni);background:color-mix(in srgb,var(--c-uni) 14%,var(--s1))}

/* now strip */
.nowcard{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nowbox{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--s2);min-width:0}
.nowbox.cur{border-color:var(--accent)}
.nowbox .t{font-weight:600;overflow-wrap:anywhere}

/* checkbox */
.chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--mute);background:transparent;padding:0;position:relative;flex:none;transition:background .15s,border-color .15s}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.chk[aria-pressed="true"]::after{content:"";position:absolute;inset:3px 6px 6px 6px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(40deg) translate(-1px,-1px)}
.chk:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
span.chk{display:inline-block}
.dot{width:26px;height:26px;display:grid;place-items:center;flex:none}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--mute));opacity:.7}

/* timeline rows */
.cat-worship{--c:var(--c-worship)}.cat-uni{--c:var(--c-uni)}.cat-study{--c:var(--c-study)}.cat-dev{--c:var(--c-dev)}
.cat-body{--c:var(--c-body)}.cat-rest{--c:var(--c-rest)}.cat-social{--c:var(--c-social)}.cat-move{--c:var(--c-move)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto 72px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;
  background:color-mix(in srgb,var(--c) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--c) 34%,var(--line))}
.row.flex{background:color-mix(in srgb,var(--c) 5%,var(--s1));border-style:dashed}
.row.now{outline:2px solid var(--accent);outline-offset:1px}
.row.done .rtitle{text-decoration:line-through;opacity:.5}
.rtime{font-size:12.5px;color:var(--mute);line-height:1.35}
.rtime b{display:block;color:var(--fg);font-weight:600}
.rbody{background:none;border:0;padding:0;text-align:start;min-width:0;display:block}
.rtitle{font-weight:500;overflow-wrap:anywhere}
.rnote{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));color:var(--c);white-space:nowrap}
.row.prayer{background:transparent;border:1px solid var(--line);border-style:solid;padding:6px 12px}
.row.prayer .rtitle{color:var(--mute);font-size:13.5px}

/* habits */
.hgroup{display:flex;flex-direction:column;gap:2px}
.hrow{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .htitle{flex:1;min-width:0;text-align:start;background:none;border:0;padding:0;overflow-wrap:anywhere}
.hrow.done .htitle{opacity:.5;text-decoration:line-through}
.core{font-size:10.5px;color:var(--c-uni);border:1px solid color-mix(in srgb,var(--c-uni) 50%,var(--line));padding:0 6px;border-radius:999px}
.gcount{font-size:12.5px;color:var(--mute)}

/* priorities + inputs */
.fld{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=time],input[type=date],input[type=number],select,textarea{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
textarea{min-height:92px;resize:vertical}
.toprow{display:flex;align-items:center;gap:8px}
.toprow .rank{font-family:var(--font-display);width:22px;text-align:center;color:var(--mute);flex:none}
.toprow input[type=text]{flex:1}
.mini{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center;flex:none;padding:0}
.mini svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{border:1px solid var(--line);background:var(--s2);border-radius:12px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* week */
.scroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--s1)}
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));min-width:1050px}
.wcol{border-inline-start:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:8px;min-width:0}
.wcol:first-child{border-inline-start:0}
.wcol.today{background:color-mix(in srgb,var(--accent) 7%,var(--s1))}
.whead{font-family:var(--font-display);display:flex;justify-content:space-between;align-items:baseline;padding:2px 2px 6px;border-bottom:1px solid var(--line)}
.whead button{background:none;border:0;padding:0;font-family:inherit;font-size:16px;font-weight:600}
.wb{display:block;text-align:start;width:100%;border-radius:9px;padding:6px 8px;font-size:12.5px;line-height:1.4;
  background:color-mix(in srgb,var(--c) 15%,var(--s1));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.wb.flex{background:color-mix(in srgb,var(--c) 5%,var(--s1));border-style:dashed}
.wb .wt{color:var(--mute);font-size:11.5px}
.wb .wn{overflow-wrap:anywhere;font-weight:500}
.matrix{border-collapse:separate;border-spacing:0;min-width:100%}
.matrix th,.matrix td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);background:var(--s1)}
.matrix th{font-weight:500;font-size:12.5px;color:var(--mute);position:static}
.matrix th.hn,.matrix td.hn{text-align:start;position:sticky;inset-inline-start:0;min-width:150px;max-width:170px;padding-inline:12px;z-index:1;border-inline-end:1px solid var(--line);font-size:13.5px}
.matrix td.na{opacity:.25}
.matrix .chk{width:22px;height:22px;border-radius:6px;margin:0 auto;display:block}
.matrix .chk[aria-pressed="true"]::after{inset:2px 5px 5px 5px}
.matrix tr.grp td{background:var(--s2);color:var(--mute);font-size:12px;text-align:start;padding-inline:12px;font-weight:500}
.ph{font-size:12px;border-radius:6px;padding:1px 4px}
.ph.over{color:var(--warn);font-weight:600}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mh{text-align:center;font-size:12px;color:var(--mute)}
.mc{aspect-ratio:1/1.05;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--s1);padding:4px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;position:relative;overflow:hidden}
.mc .n{font-size:13px;font-weight:500}
.mc.today{outline:2px solid var(--accent);outline-offset:1px}
.mc.out{opacity:.25;pointer-events:none}
.mc .fill{position:absolute;inset:auto 0 0 0;background:var(--accent);opacity:.28;z-index:0}
.mc>*{position:relative;z-index:1}
.mc .evd{width:6px;height:6px;border-radius:50%;background:var(--c-uni)}
.mc .pc{font-size:10px;color:var(--mute)}
.evrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.evrow:last-child{border-bottom:0}
.evd2{font-family:var(--font-display);min-width:48px;text-align:center;font-size:15px}
.evrow button.rbody{flex:1}

/* study */
.crs{display:flex;flex-direction:column;gap:10px}
.crs-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.crs-name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper b{min-width:44px;text-align:center}
.cl{display:flex;flex-wrap:wrap;gap:8px}
.tg{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--s2);font-size:13.5px}
.tg .chk{width:20px;height:20px;border-radius:6px}
.tg .chk[aria-pressed="true"]::after{inset:1px 4px 4px 4px}
.count{font-family:var(--font-display);font-size:34px;line-height:1}

/* settings grid */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px));
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:20}
.nav-in{display:flex;gap:2px;width:100%;max-width:560px}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:12px;color:var(--mute);font-size:11.5px;min-width:0}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:16px;
  background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:19}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* sheet */
.bg{position:fixed;inset:0;background:rgba(3,6,12,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:90%;overflow:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:5px 12px;font-size:13.5px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt{display:flex;flex-direction:column;gap:2px;text-align:start;padding:12px 14px;border:1px solid var(--line);background:var(--s2);border-radius:14px}
.opt b{font-family:var(--font-display);font-size:16px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.legend i.dash{background:transparent;border:1.5px dashed var(--mute)}
.err{color:var(--warn);font-size:13px}
@media (max-width:420px){
  .row{grid-template-columns:auto 64px minmax(0,1fr);}
  .row .tag{display:none}
  .big{font-size:38px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app"></div>
<button class="fab" id="fab" data-act="add" aria-label="إضافة"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="nav" aria-label="التنقل"><div class="nav-in" id="nav"></div></nav>
<div class="bg" id="sheetbg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
'use strict';
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','ar');

/* ---------- constants ---------- */
var KEY='nizam-hayati-v1';
var DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var ORDER=[6,0,1,2,3,4,5];
var CATS={worship:'عبادة',uni:'جامعة',study:'مذاكرة',dev:'تطوير',body:'صحة',rest:'راحة',social:'اجتماعي',move:'مواصلات'};
var CHECKABLE={worship:1,uni:1,study:1,dev:1,body:1,social:1};
var PR=[['fajr','الفجر'],['dhuhr','الظهر'],['asr','العصر'],['maghrib','المغرب'],['isha','العشاء']];
var GROUPS=['الصلوات','الأوراد والأذكار','العلم والتعلم','الجسم والهدوء'];
var ALL=[0,1,2,3,4,5,6];

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function pad(n){return String(n).padStart(2,'0')}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
function todayKey(){return key(new Date())}
function t2m(t){var p=(t||'0:0').split(':');return (+p[0])*60+(+p[1]||0)}
function f12(t){if(!t)return '';var p=t.split(':'),h=+p[0],m=+p[1];var ap=h<12?'ص':'م';h=h%12||12;return h+':'+pad(m)+' '+ap}
function weekStart(d){return addDays(d,-((d.getDay()+1)%7))}
function fmt(d,o){try{return new Intl.DateTimeFormat('ar-EG-u-nu-latn',o).format(d)}catch(e){return key(d)}}
function hijri(d){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){return ''}}
var ICON={
  today:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M9 15l2 2 4-4"/></svg>',
  week:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M8 5v15M13 5v15M18 5v15M3 11h18"/></svg>',
  month:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>',
  study:'<svg viewBox="0 0 24 24"><path d="M4 6c3-1.5 5-1.5 8 0v13c-3-1.5-5-1.5-8 0zM20 6c-3-1.5-5-1.5-8 0v13c3-1.5 5-1.5 8 0z"/></svg>',
  more:'<svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',

/* ---------- storage ---------- */
var memStore=null;
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){raw=memStore}
  var base=defaults();
  if(!raw)return base;
  try{
    var s=JSON.parse(raw);
    Object.keys(base).forEach(function(k){if(s[k]===undefined)s[k]=base[k]});
    s.settings=Object.assign({},base.settings,s.settings||{});
    s.settings.prayers=Object.assign({},base.settings.prayers,(s.settings||{}).prayers||{});
    s.view=Object.assign({},base.view,{tab:(s.view&&s.view.tab)||'today'});
    s.view.date=todayKey();s.view.weekDate=todayKey();s.view.month=todayKey().slice(0,7);
    return s;
  }catch(e){return base}
}
var S=load();
function save(){
  var raw=JSON.stringify(S);
  try{localStorage.setItem(KEY,raw)}catch(e){memStore=raw}
}
function applyTheme(){
  var r=document.documentElement;
  if(S.settings.theme==='dark'||S.settings.theme==='light')r.setAttribute('data-theme',S.settings.theme);
  else r.removeAttribute('data-theme');
  var m=document.querySelector('meta[name="theme-color"]');
  if(m){var dark=S.settings.theme==='dark'||(S.settings.theme!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);m.setAttribute('content',dark?'#090c12':'#edf0f5')}
}

/* ---------- log + progress ---------- */
function getLog(k,create){
  if(!S.log[k]){if(!create)return null;S.log[k]={d:{},top:['','',''],topDone:[0,0,0],phone:'',note:'',tired:0}}
  var L=S.log[k];
  if(!L.d)L.d={};if(!L.top)L.top=['','',''];if(!L.topDone)L.topDone=[0,0,0];
  return L;
}
function inEvent(e,k){return e.date<=k&&k<=(e.end||e.date)}
function itemsFor(k){
  var dow=parseKey(k).getDay(),L=getLog(k,false)||{},tired=!!L.tired;
  var blocks=S.blocks.filter(function(b){return b.days.indexOf(dow)>-1});
  if(tired)blocks=blocks.filter(function(b){return b.kind==='fixed'});
  var habits=S.habits.filter(function(h){return !h.days||h.days.indexOf(dow)>-1});
  var all=habits;
  if(tired)habits=habits.filter(function(h){return h.core});
  var events=S.events.filter(function(e){return inEvent(e,k)});
  return {blocks:blocks,habits:habits,events:events,allHabits:all};
}
function progress(k){
  var it=itemsFor(k),D=(getLog(k,false)||{}).d||{},tot=0,done=0,cT=0,cD=0;
  it.blocks.forEach(function(b){if(CHECKABLE[b.cat]){tot++;if(D['b:'+b.id])done++}});
  it.habits.forEach(function(h){tot++;if(D['h:'+h.id])done++});
  it.events.forEach(function(e){tot++;if(D['e:'+e.id])done++});
  it.allHabits.forEach(function(h){if(h.core){cT++;if(D['h:'+h.id])cD++}});
  return {tot:tot,done:done,pct:tot?Math.round(done/tot*100):0,cT:cT,cD:cD};
}
function nowMin(){var n=new Date();return n.getHours()*60+n.getMinutes()}

function renderMonth(){
  var ym=S.view.month,y=+ym.slice(0,4),mo=+ym.slice(5,7)-1,first=new Date(y,mo,1),dim=new Date(y,mo+1,0).getDate();

    '<div class="navrow"><button class="iconbtn" data-act="month" data-n="-1" aria-label="الشهر السابق">'+ICON.prev+'</button><button class="iconbtn" data-act="month" data-n="1" aria-label="الشهر التالي">'+ICON.next+'</button></div>');

  ORDER.forEach(function(dow){h+='<div class="mh">'+DAYS[dow].replace('ال','').slice(0,3)+'</div>'});
  for(var i=0;i<off;i++)h+='<div class="mc out"></div>';
  for(var d=1;d<=dim;d++){
    var k=y+'-'+pad(mo+1)+'-'+pad(d),L=getLog(k,false),pr=progress(k),has=L&&pr.done>0,ev=S.events.some(function(e){return inEvent(e,k)});

  var evs=S.events.filter(function(e){return e.date.slice(0,7)===ym||(e.end&&e.end.slice(0,7)===ym)}).sort(function(a,b){return a.date<b.date?-1:1});
  h+='<div class="card"><div class="card-head"><h2>أحداث الشهر</h2><button class="pill" data-act="add-event">+ حدث</button></div>';
  if(!evs.length)h+='<div class="muted">مفيش أحداث الشهر ده.</div>';
  evs.forEach(function(e){var dt=parseKey(e.date);h+='<div class="evrow"><div class="evd2 num">'+dt.getDate()+'<div class="muted small">'+fmt(dt,{month:'short'})+'</div></div><button class="rbody" data-act="edit-event" data-id="'+e.id+'"><div class="rtitle">'+esc(e.title)+'</div>'+(e.note?'<div class="rnote">'+esc(e.note)+'</div>':'')+'</button></div>'});
  h+='</div></div>';
  // monthly summary
  var tot=0,cnt=0;for(var d2=1;d2<=dim;d2++){var kk=y+'-'+pad(mo+1)+'-'+pad(d2),LL=getLog(kk,false);if(LL){var p=progress(kk);if(p.done>0){tot+=p.pct;cnt++}}}
  h+='<div class="wrap" style="padding-top:0"><div class="card"><div class="lbl">متوسط الإنجاز في الأيام المسجلة</div><div class="big num">'+(cnt?Math.round(tot/cnt):0)+'%</div><div class="muted small num">'+cnt+' يوم مسجل</div></div></div>';
  return h;
}

function crsPct(c){
  var lec=c.lecTotal?Math.min(1,c.lecDone/c.lecTotal):0;
  return Math.round((lec*0.6+(c.summary?0.15:0)+(c.practice?0.15:0)+(c.review?0.1:0))*100);
}

var TABS=[['today','اليوم'],['week','الأسبوع'],['month','الشهر'],['study','المذاكرة'],['more','المزيد']];

  var t=S.view.tab,ae=document.activeElement,keepScroll=window.scrollY;

  openSheet('<h2>إضافة</h2>'+
    '<button class="opt" data-act="add-block"><b>نشاط في الجدول</b><span class="muted small">ثابت يتكرر كل أسبوع، أو متغير</span></button>'+
    '<button class="opt" data-act="add-habit"><b>عادة بمربع</b><span class="muted small">ورد أو تمرين أو أي حاجة بتتابعها يوميًا</span></button>'+
    '<button class="opt" data-act="add-event"><b>حدث بتاريخ</b><span class="muted small">امتحان، سهرة، موعد لمرة واحدة</span></button>'+
    '<div class="btns"><button class="btn" data-act="close">إغلاق</button></div>');
}
function bad(id){var e=document.getElementById(id);if(e){e.style.borderColor='var(--warn)';e.focus()}}

/* ---------- actions ---------- */
function setLogVal(path,v){
  var L=getLog(S.view.date,true);
  if(path[1]==='top')L.top[+path[2]]=v;
  else if(path[1]==='phone')L.phone=v===''?'':v;
  else if(path[1]==='note')L.note=v;
}
function toggle(k,date){
  var L=getLog(date||S.view.date,true);
  if(L.d[k])delete L.d[k];else L.d[k]=1;
}
function byId(arr,id){return arr.filter(function(x){return x.id===id})[0]}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');
  if(!t){if(ev.target.id==='sheetbg')closeSheet();return}
  var a=t.getAttribute('data-act'),id=t.getAttribute('data-id');
  switch(a){
    case 'tab':go(t.getAttribute('data-tab'));return;
    case 'theme':S.settings.theme=(document.documentElement.getAttribute('data-theme')==='light'||(S.settings.theme==='auto'&&!matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';save();applyTheme();render();return;
    case 'day':S.view.date=key(addDays(parseKey(S.view.date),+t.getAttribute('data-n')));save();render();return;
    case 'gotoday':S.view.date=todayKey();save();render();return;
    case 'week':S.view.weekDate=key(addDays(parseKey(S.view.weekDate),7*+t.getAttribute('data-n')));save();render();return;
    case 'month':{var p=S.view.month.split('-'),dt=new Date(+p[0],+p[1]-1+(+t.getAttribute('data-n')),1);S.view.month=dt.getFullYear()+'-'+pad(dt.getMonth()+1);save();render();return}
    case 'openday':S.view.date=t.getAttribute('data-date');S.view.tab='today';save();render();window.scrollTo(0,0);return;
    case 'tg':toggle(t.getAttribute('data-k'),t.getAttribute('data-date'));save();render();return;
    case 'tgtop':{var L=getLog(S.view.date,true),i=+t.getAttribute('data-i');L.topDone[i]=L.topDone[i]?0:1;save();render();return}
    case 'uptop':{var L2=getLog(S.view.date,true),j=+t.getAttribute('data-i');var x=L2.top[j];L2.top[j]=L2.top[j-1];L2.top[j-1]=x;var y=L2.topDone[j];L2.topDone[j]=L2.topDone[j-1];L2.topDone[j-1]=y;save();render();return}
    case 'tired':{var L3=getLog(S.view.date,true);L3.tired=L3.tired?0:1;save();render();return}
    case 'add':addSheet();return;
    case 'close':closeSheet();return;
    case 'add-block':blockSheet(null);return;
    case 'add-block-today':blockSheet(null,parseKey(S.view.date).getDay());return;
    case 'add-habit':habitSheet(null);return;
    case 'add-event':eventSheet(null,S.view.tab==='today'?S.view.date:null);return;
    case 'edit-block':blockSheet(id);return;
    case 'edit-habit':habitSheet(id);return;
    case 'edit-event':eventSheet(id);return;
    case 'chip':t.classList.toggle('on');return;
    case 'save-block':{
      var title=val('f-title'),days=chipDays();
      if(!title){bad('f-title');return}
      if(!days.length)return;
      var o={title:title,start:val('f-s')||'09:00',end:val('f-e')||'10:00',kind:val('f-kind'),cat:val('f-cat'),note:val('f-note'),days:days};
      if(id){Object.assign(byId(S.blocks,id),o)}else{o.id='b'+uid();S.blocks.push(o)}
      save();closeSheet();render();return}
    case 'del-block':S.blocks=S.blocks.filter(function(b){return b.id!==id});save();closeSheet();render();return;
    case 'save-habit':{
      var ti=val('f-title'),ds=chipDays();
      if(!ti){bad('f-title');return}
      if(!ds.length)return;
      var h={title:ti,group:val('f-group'),days:ds.length===7?null:ds,core:document.getElementById('f-core').checked};
      if(id){Object.assign(byId(S.habits,id),h)}else{h.id='h'+uid();h.prayer='';S.habits.push(h)}
      save();closeSheet();render();return}
    case 'del-habit':S.habits=S.habits.filter(function(x){return x.id!==id});save();closeSheet();render();return;
    case 'save-event':{
      var et=val('f-title'),dd=val('f-d');
      if(!et){bad('f-title');return}
      if(!dd){bad('f-d');return}
      var e={title:et,date:dd,end:val('f-de'),start:val('f-s'),stop:val('f-e'),cat:val('f-cat'),note:val('f-note')};
      if(e.end&&e.end<e.date)e.end='';
      if(id){Object.assign(byId(S.events,id),e)}else{e.id='e'+uid();S.events.push(e)}
      save();closeSheet();render();return}
    case 'del-event':S.events=S.events.filter(function(x){return x.id!==id});save();closeSheet();render();return;
    case 'cstep':{var c=byId(S.courses,id),f=t.getAttribute('data-f');c[f]=Math.max(0,(c[f]||0)+(+t.getAttribute('data-n')));save();render();return}
    case 'ctog':{var c2=byId(S.courses,id),f2=t.getAttribute('data-f');c2[f2]=!c2[f2];save();render();return}
    case 'ostep':{var o2=byId(S.oc,id),f3=t.getAttribute('data-f');o2[f3]=Math.max(0,(o2[f3]||0)+(+t.getAttribute('data-n')));save();render();return}
    case 'export':{var ta=document.getElementById('bk');ta.value=JSON.stringify(S);ta.focus();ta.select();
      var msg=document.getElementById('bkmsg');
      try{navigator.clipboard.writeText(ta.value).then(function(){msg.style.color='var(--good)';msg.textContent='تم النسخ. الصقه في ملاحظة أو رسالة لنفسك.'},function(){msg.style.color='var(--mute)';msg.textContent='النص ظهر وتم تحديده. انسخه يدويًا.'})}catch(e){msg.style.color='var(--mute)';msg.textContent='النص ظهر وتم تحديده. انسخه يدويًا.'}
      return}
    case 'dl':{try{var bl=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(bl),an=document.createElement('a');an.href=u;an.download='nizam-hayati-backup.json';document.body.appendChild(an);an.click();an.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000)}catch(e){}
      var m2=document.getElementById('bkmsg');m2.style.color='var(--mute)';m2.textContent='لو التنزيل ماحصلش، استخدم زر عرض ونسخ.';return}
    case 'import':{var m3=document.getElementById('bkmsg');
      try{var o3=JSON.parse(document.getElementById('bk').value);
        if(!o3||!Array.isArray(o3.blocks)||!Array.isArray(o3.habits))throw new Error('x');
        S=Object.assign(defaults(),o3);S.view.date=todayKey();S.view.weekDate=todayKey();S.view.month=todayKey().slice(0,7);S.view.tab='more';
        save();applyTheme();render();
        var m4=document.getElementById('bkmsg');m4.style.color='var(--good)';m4.textContent='تم الاسترجاع.';
      }catch(e){m3.style.color='var(--warn)';m3.textContent='النص مش نسخة صحيحة. الصق النسخة كاملة.'}
      return}
    case 'reset':{
      if(t.getAttribute('data-sure')!=='1'){t.setAttribute('data-sure','1');t.textContent='اضغط تاني للتأكيد';return}
      S=defaults();save();applyTheme();render();return}
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target,s=t.getAttribute&&t.getAttribute('data-set');
  if(!s)return;
  var p=s.split('.'),v=t.value;
  if(t.type==='number'){v=v===''?'':parseFloat(v);if(p[0]==='settings'&&v==='')v=0}
  if(p[0]==='log')setLogVal(p,v);
  else if(p[0]==='settings'){if(p[1]==='prayers')S.settings.prayers[p[2]]=v;else S.settings[p[1]]=v}
  else if(p[0]==='notes')S.notes[p[1]]=v;
  else if(p[0]==='course'){byId(S.courses,p[1])[p[2]]=v}
  save();
  if(t.getAttribute('data-re'))render();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetOpen())closeSheet()});
setInterval(function(){
  var ae=document.activeElement,typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT');
  if(S.view.tab==='today'&&S.view.date===todayKey()&&!typing&&!sheetOpen())render();
},60000);

applyTheme();
render();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
